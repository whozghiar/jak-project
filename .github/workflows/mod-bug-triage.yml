name: 🐛 Mod Bug Auto-Triage

# Auto-labels issues opened from the "Mod Bug Report" form so bugs can be
# tracked per game and per mod (label:jak2 label:mod:transport-ag-traffic),
# without anyone having to type labels by hand. This is what makes the
# tracking usable: a maintainer fixing a mod filters issues by its label,
# fixes it on that mod's branch with `Fixes #<issue>` in the commit, and the
# issue auto-closes when that commit lands on the branch's default merge
# target. See docs/modding/guides/mod_bug_tracking.md for the full workflow.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label-mod-bug:
    if: contains(github.event.issue.labels.*.name, 'mod-bug')
    runs-on: ubuntu-latest
    steps:
      - name: Derive game + mod labels from the form answers
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            function fieldValue(label) {
              const re = new RegExp(`###\\s*${label}\\s*\\n+([^\\n#]+)`, "i");
              const m = body.match(re);
              return m ? m[1].trim() : "";
            }

            function slugify(s) {
              return s
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "");
            }

            const game = fieldValue("Game");
            const modConcerned = fieldValue("Mod Concerned");
            const exactMod = fieldValue(`Exact Mod Name \\(if you selected "Other" above\\)`);

            const labels = new Set();

            const gameMap = { "jak 1": "jak1", "jak 2": "jak2", "jak 3": "jak3" };
            const gameKey = gameMap[game.toLowerCase()];
            if (gameKey) labels.add(gameKey);

            // The dropdown holds "[Jak X] <exact Launcher display name>" (or "Other ...");
            // strip the game-tag prefix and slug the display name itself — there is no
            // branch path in this field any more, only released mods' display names.
            const isOther = /^other\b/i.test(modConcerned);
            const displayName = isOther
              ? exactMod
              : modConcerned.replace(/^\[Jak\s*[123]\]\s*/i, "");

            if (displayName) labels.add(`mod:${slugify(displayName)}`);

            if (labels.size === 0) return;

            for (const name of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color: name.startsWith("mod:") ? "5319e7" : "1d76db",
                });
              } catch (e) {
                // Label already exists — fine.
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: Array.from(labels),
            });
