name: "Catalog: 📦 Sync Global Mod Catalog"

# Regenerates root index.json on master-dev by aggregating all published GitHub Releases
# into an OpenGOAL Launcher Mod Source Schema v1 compliant catalog.
#
# This allows players to add a single URL into the OpenGOAL Launcher:
#   https://raw.githubusercontent.com/<user>/<repo>/master-dev/index.json
# and have all published mods appear at once with 1-click install.
#
# Triggers:
# - Whenever a release is published, unpublished, edited, or deleted on GitHub
# - workflow_call: can be invoked directly from release.yml
# - workflow_dispatch: manual execution anytime from the Actions tab

on:
  release:
    types: [published, unpublished, edited, deleted]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalog:
    name: "📦 Refresh Global index.json from Releases"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master-dev
        uses: actions/checkout@v4
        with:
          ref: master-dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Aggregate published releases into root index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/modding/sync_global_catalog.py --repo "${{ github.repository }}"

      - name: Commit & push if it changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain index.json)" ]; then
            git add index.json
            git commit -m "chore: sync global index.json catalog with published releases (AI-assisted)"
            git push origin master-dev
          else
            echo "Nothing to commit — global index.json already matches published releases."
          fi
