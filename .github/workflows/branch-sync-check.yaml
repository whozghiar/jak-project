name: 🔗 Branch Sync Health Check

# Answers exactly one question, as cheaply as possible: is THIS branch's
# current HEAD caught up with master-dev? Its GitHub-generated status badge
# (docs.github.com/actions/how-tos/monitor-workflows/add-a-status-badge) is
# what each mod branch's own README embeds — no custom SVG rendering, no
# script maintaining an image: GitHub serves it live from this workflow's own
# run history for that branch.
#
# Why "on: push" and not "on: schedule": GitHub Actions only ever evaluates a
# scheduled (cron) trigger from the repository's default branch — there is no
# way to cron this separately on ~20 mod branches. `push` is the next best
# signal: it fires right after a sync-branch-with-master-dev.yml run (or a
# local `task modding-sync-branch -- --push`) pushes to a branch, so the
# badge re-confirms itself the moment someone actually syncs it, and it also
# fires — and can go red — if someone pushes their own commits to the branch
# without syncing first. What it cannot do is turn red purely because
# master-dev moved on without any new push landing here; to audit fleet-wide
# mergeability at any time, run 'task modding-branch-status'.

on:
  push:
    branches:
      - 'jak[1-3]/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-sync:
    name: "🔗 Caught up with master-dev?"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch master-dev
        run: git fetch origin master-dev

      - name: Verify Ancestry
        run: |
          TARGET_REF="origin/master-dev"

          if git merge-base --is-ancestor "$TARGET_REF" HEAD; then
            echo "✅ This branch includes the latest master-dev ($TARGET_REF)."
          else
            echo "::error::This branch has not merged the latest origin/master-dev yet ($TARGET_REF). Run 'task modding-sync-branch -- --push', or trigger the sync-branch-with-master-dev.yml workflow against this branch."
            exit 1
          fi
