name: 🔗 Branch Sync Health Check

# Answers exactly one question, as cheaply as possible: is THIS branch's
# current HEAD caught up with master-dev? Its GitHub-generated status badge
# (docs.github.com/actions/how-tos/monitor-workflows/add-a-status-badge) is
# what each mod branch's own README embeds — no custom SVG rendering, no
# script maintaining an image: GitHub serves it live from this workflow's own
# run history for that branch.
#
# Why "on: push" and not "on: schedule": GitHub Actions only ever evaluates a
# scheduled (cron) trigger from the repository's default branch — there is no
# way to cron this separately on ~20 mod branches. `push` is the next best
# signal: it fires right after sync_branches_with_master.py auto-merges and
# pushes to a branch (so in the common case the badge re-confirms itself
# every day), and it also fires — and can go red — if someone pushes their
# own commits to the branch without syncing first. What it cannot do is turn
# red purely because master-dev moved on without any new push landing here;
# for that live, all-branches view, see master-dev's own
# docs/modding/tools/branch_sync_status.md.

on:
  push:
    branches:
      - 'jak[1-3]/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-sync:
    name: "🔗 Caught up with master-dev?"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch master-dev
        run: git fetch origin master-dev

      - name: Verify Ancestry
        run: |
          if git merge-base --is-ancestor origin/master-dev HEAD; then
            echo "✅ This branch includes the latest master-dev."
          else
            echo "::error::This branch has not merged the latest origin/master-dev yet. Run 'task modding-sync-branch', or wait for the next automated sync."
            exit 1
          fi
