name: Sync Upstream Mirror & Dev

on:
  schedule:
    # Exécution quotidienne à 12:00 (Heure de Paris UTC+2 = 10:00 UTC en heure d'été)
    # Remplacez par '0 12 * * *' si vous préférez 12:00 UTC (14:00 Paris)
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync-upstream:
    name: Sync Master with Upstream & Propagate to Master-Dev
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Author & Settings
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global checkout.defaultRemote origin

      - name: Sync master with upstream/master (Fast-Forward)
        run: |
          echo "Fetching upstream official repository..."
          git remote add upstream https://github.com/open-goal/jak-project.git || true
          git fetch upstream master

          echo "Fast-forwarding master branch..."
          git checkout -B master origin/master
          git merge --ff-only upstream/master
          git push origin master

      - name: Sync master-dev with master
        id: sync_master_dev
        run: |
          echo "Checking out master-dev..."
          git checkout master-dev

          echo "Attempting to merge master into master-dev..."
          # Attempt merge; handle modify/delete conflicts on removed workflows gracefully
          if ! git merge master --no-commit; then
            echo "Checking merge conflicts..."
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "Conflicts detected in: $conflicts"

            # Discard any upstream workflow changes for deleted workflows
            for file in $conflicts; do
              if [[ "$file" == .github/workflows/* && "$file" != ".github/workflows/sync-upstream.yaml" ]]; then
                echo "Ignoring upstream changes and removing unwanted workflow: $file"
                git rm -f "$file"
              fi
            done

            # Verify if any non-workflow conflicts remain
            remaining=$(git diff --name-only --diff-filter=U)
            if [ -n "$remaining" ]; then
              echo "::warning::Real code conflict detected between upstream master and master-dev in: $remaining. Aborting merge."
              git merge --abort
              exit 0
            fi
          fi

          # Safety cleanup: ensure master-dev strictly keeps only sync-upstream.yaml
          for f in .github/workflows/*; do
            if [ "$f" != ".github/workflows/sync-upstream.yaml" ]; then
              echo "Pruning unwanted workflow: $f"
              git rm -rf "$f" 2>/dev/null || rm -rf "$f"
            fi
          done

          git commit -m "chore: sync master-dev with upstream master (AI-assisted)" || true
          git push origin master-dev
          echo "master-dev successfully updated with latest upstream changes (unwanted workflows ignored)."

      - name: Sync Mod Branches & Update Conflict Dashboard
        run: |
          echo "Synchronizing clean mod branches with master, logging history, and updating dashboard..."
          python scripts/modding/sync_branches_with_master.py --push

          if [ -n "$(git status --porcelain docs/modding/tools/branch_sync_status.md docs/modding/tools/branch_sync_history.md README.md)" ]; then
            git add docs/modding/tools/branch_sync_status.md docs/modding/tools/branch_sync_history.md README.md
            git commit -m "docs: update mod branches sync dashboard and history log (AI-assisted)"
            git push origin master-dev
          fi
