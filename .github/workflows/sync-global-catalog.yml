name: "Catalog: 📦 Sync Global Mod Catalog"

# Regenerates root index.json on master-dev as an OpenGOAL Launcher Mod Source Schema v1
# catalog built from the mod repositories alone (public repositories of the same owner with the
# opengoal-mod topic): for each one, the index.json attached to its most advanced release, the
# one with the highest version in its tag. Branches and this repository's own releases are
# never read.
#
# This allows players to add a single URL into the OpenGOAL Launcher:
#   https://raw.githubusercontent.com/<user>/<repo>/master-dev/index.json
# and have all published mods appear at once with 1-click install.
#
# Triggers:
# - schedule: daily, so releases published from mod repositories (which cannot
#   trigger a workflow here) reach the catalog within a day
# - workflow_dispatch: manual execution anytime from the Actions tab, to list
#   a new release at once
# - workflow_call: available for a reusable-workflow `uses:` invocation;
#   nothing calls it that way today
#
# Restricted to the repository owner or GitHub's own automation (see the
# "Restrict to repository owner or internal automation" step) - this pushes to
# master-dev, so nobody else may trigger it directly.

on:
  schedule:
    # Daily at 10:30 UTC, after sync-upstream.yaml (10:00 UTC).
    - cron: '30 10 * * *'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalog:
    name: "📦 Refresh Global index.json from Mod Repositories"
    # Mother repository only: mod repositories created from master-dev inherit this file.
    if: endsWith(github.repository, '/jak-project')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restrict to repository owner or internal automation
        if: github.actor != github.repository_owner && github.actor != 'github-actions[bot]'
        run: |
          echo "::error::This workflow may only be run by the repository owner (${{ github.repository_owner }}) or internal automation. Triggered by: ${{ github.actor }}."
          exit 1

      - name: Checkout master-dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master-dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Build root index.json from each mod repository's latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/modding/sync_global_catalog.py --repo "${{ github.repository }}"

      - name: Commit & push if it changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain index.json)" ]; then
            git add index.json
            git commit -m "chore: sync global index.json catalog with published releases (AI-assisted)"
            git push origin master-dev
          else
            echo "Nothing to commit — global index.json already matches published releases."
          fi
