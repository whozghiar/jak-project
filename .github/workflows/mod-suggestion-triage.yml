name: "Bugs: 💡 Mod Suggestion Auto-Triage"

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label-mod-suggestion:
    if: contains(github.event.issue.labels.*.name, 'mod-suggestion')
    runs-on: ubuntu-latest
    steps:
      - name: Derive game and category labels
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            function fieldValue(labelRegex) {
              const re = new RegExp(`###\\s*${labelRegex}\\s*\\n+([^\\n#]+)`, "i");
              const m = body.match(re);
              return m ? m[1].trim() : "";
            }

            const game = fieldValue("Target Game.*");
            const category = fieldValue("Mod Category.*");

            const labels = new Set();
            labels.add("mod-suggestion");
            labels.add("enhancement");

            // Game label
            const gameLower = game.toLowerCase();
            if (gameLower.includes("jak 1")) labels.add("jak1");
            else if (gameLower.includes("jak 2")) labels.add("jak2");
            else if (gameLower.includes("jak 3")) labels.add("jak3");
            else if (gameLower.includes("jak x")) labels.add("jakx");

            // Category label
            const catLower = category.toLowerCase();
            if (catLower.includes("gameplay")) labels.add("type:gameplay");
            else if (catLower.includes("3d") || catLower.includes("entities")) labels.add("type:entities");
            else if (catLower.includes("texture") || catLower.includes("visuals")) labels.add("type:textures");
            else if (catLower.includes("audio") || catLower.includes("music")) labels.add("type:audio");
            else if (catLower.includes("level")) labels.add("type:levels");
            else if (catLower.includes("quality of life") || catLower.includes("config")) labels.add("type:qol");

            for (const name of labels) {
              try {
                let color = "1d76db"; // blue
                if (name.startsWith("type:")) color = "5319e7"; // purple
                if (name === "mod-suggestion") color = "0e8a16"; // green
                if (name === "enhancement") color = "a2eeef";
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                });
              } catch (e) {
                // Label exists
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: Array.from(labels),
            });
