name: 🏷️ Sync Mod Bug Report Options

# Keeps the "Mod Concerned" dropdown in mod-bug-report.yml limited to mods that actually
# have a published GitHub Release — never to whatever a branch's committed index.json
# happens to say, since that file can carry a real-looking checksummed version even when
# no release was ever actually published (a local/dry run, a release later deleted, ...).
# See scripts/modding/sync_bug_report_options.py and docs/modding/tools/mod_bug_tracking.md.

on:
  release:
    types: [published, unpublished, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-options:
    name: "🔄 Refresh Mod Concerned dropdown from Releases"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master-dev
        uses: actions/checkout@v4
        with:
          ref: master-dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate dropdown from published Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/modding/sync_bug_report_options.py --repo "${{ github.repository }}"

      - name: Commit & push if it changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain .github/ISSUE_TEMPLATE/mod-bug-report.yml)" ]; then
            git add .github/ISSUE_TEMPLATE/mod-bug-report.yml
            git commit -m "chore: sync mod bug report dropdown with published releases (AI-assisted)"
            git push origin master-dev
          else
            echo "Nothing to commit — dropdown already matches published releases."
          fi
