name: 🔀 Sync Branch with master-dev

# On-demand equivalent of `task modding-sync-branch -- --push`, runnable
# without a local checkout: merges origin/master-dev into whichever branch
# you pick with "Use workflow from" in the Actions tab, resolves the same
# deterministic doc/workflow conflicts scripts/modding/sync_branch_with_master_dev.py
# always resolves locally (see scripts/modding/sync_common.py), and pushes
# the result. Manual only (workflow_dispatch) - sync-upstream.yaml no longer
# touches mod branches at all (see its own header comment), so this is the
# primary way a branch gets master-dev's changes; `task modding-branch-status
# -- --push` remains the fleet-wide (every clean branch) alternative, run
# locally on demand.
#
# Merge only, no --rebase: a CI-triggered rebase would force-push over a
# branch's published history with nobody there to review the result first -
# do that locally instead if you actually want a linear history
# (task modding-sync-branch -- --rebase).
#
# Restricted to the repository owner (see the "Restrict to repository owner"
# step) - this pushes to the target branch, so only the owner may trigger it,
# regardless of who else has write access.

on:
  workflow_dispatch:

concurrency:
  group: sync-branch-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-branch:
    name: "🔀 Merge master-dev & Push"
    if: github.ref_name != 'master-dev' && github.ref_name != 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restrict to repository owner
        if: github.actor != github.repository_owner
        run: |
          echo "::error::This workflow may only be run by the repository owner (${{ github.repository_owner }}). Triggered by: ${{ github.actor }}."
          exit 1

      - name: Checkout Branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Configure Git Author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge master-dev and push
        run: python scripts/modding/sync_branch_with_master_dev.py --push
