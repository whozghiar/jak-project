name: 🔄 Sync Upstream Mirror

# Scope is deliberately just master and master-dev: fast-forwards master from
# upstream open-goal/jak-project, then merges master into master-dev (pruning
# any upstream workflow/issue-template this fork doesn't want). It no longer
# touches mod branches automatically - use sync-branch-with-master-dev.yml
# (per-branch, on demand) or `task modding-branch-status -- --push`
# (fleet-wide, run manually) to catch a branch up with master-dev.
#
# Restricted to the repository owner for the manual trigger path (see the
# "Restrict to repository owner" step) - this pushes to master and
# master-dev, so only the owner may run it on demand. The scheduled cron run
# is unaffected: for a `schedule` event, github.actor is the user who last
# committed the workflow's cron schedule, which is the owner here too.

on:
  schedule:
    # Daily at 12:00 Paris time (UTC+2 in summer) = 10:00 UTC.
    # Change to '0 12 * * *' if you want a fixed 12:00 UTC (14:00 Paris) instead.
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-upstream:
    name: Sync Master with Upstream & Propagate to Master-Dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Restrict to repository owner
        if: github.actor != github.repository_owner
        run: |
          echo "::error::This workflow may only be run by the repository owner (${{ github.repository_owner }}). Triggered by: ${{ github.actor }}."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Configure Git Author & Settings
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global checkout.defaultRemote origin

      - name: Sync master with upstream/master (Fast-Forward)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "Fetching upstream official repository..."
          git remote add upstream https://github.com/open-goal/jak-project.git || true
          git fetch upstream master

          echo "Fast-forwarding master branch..."
          git checkout -B master origin/master
          if git merge --ff-only upstream/master; then
            echo "Pushing updated master to origin..."
            if [ -n "$GH_PAT" ]; then
              git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}
            fi
            if ! git push origin master; then
              echo "::warning::Could not push master to origin (likely due to upstream workflow updates that GITHUB_TOKEN is restricted from pushing). To automate this, create a PAT with repo+workflow scope and set it as secret GH_PAT."
            fi
            git remote set-url origin https://github.com/${{ github.repository }}
          fi

      - name: Sync master-dev with master
        id: sync_master_dev
        run: |
          allowed_workflows=(".github/workflows/sync-upstream.yaml" ".github/workflows/release.yml" ".github/workflows/branch-sync-check.yaml" ".github/workflows/sync-global-catalog.yml" ".github/workflows/mod-bug-report-sync.yml" ".github/workflows/mod-bug-triage.yml" ".github/workflows/mod-suggestion-triage.yml" ".github/workflows/lint.yml" ".github/workflows/build.yml" ".github/workflows/sync-branch-with-master-dev.yml")

          echo "Checking out master-dev..."
          git checkout master-dev

          echo "Attempting to merge master into master-dev..."
          # Attempt merge; handle modify/delete conflicts on removed workflows gracefully
          if ! git merge master --no-commit; then
            echo "Checking merge conflicts..."
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "Conflicts detected in: $conflicts"

            # Discard any upstream workflow changes for deleted workflows and pruned issue templates
            for file in $conflicts; do
              if [[ "$file" == .github/workflows/* ]]; then
                is_allowed=false
                for allowed in "${allowed_workflows[@]}"; do
                  if [ "$file" == "$allowed" ]; then
                    is_allowed=true
                    break
                  fi
                done
                if [ "$is_allowed" = false ]; then
                  echo "Ignoring upstream changes and removing unwanted workflow: $file"
                  git rm -f "$file"
                fi
              elif [[ "$file" == .github/ISSUE_TEMPLATE/* ]]; then
                if [ "$file" == ".github/ISSUE_TEMPLATE/config.yml" ]; then
                  echo "Preserving custom mod issue configuration in $file"
                  git checkout --ours "$file"
                  git add "$file"
                elif [ "$file" != ".github/ISSUE_TEMPLATE/mod-bug-report.yml" ] && [ "$file" != ".github/ISSUE_TEMPLATE/mod-suggestion.yml" ]; then
                  echo "Pruning upstream issue template: $file"
                  git rm -f "$file"
                fi
              fi
            done

            # Verify if any non-workflow / non-template conflicts remain
            remaining=$(git diff --name-only --diff-filter=U)
            if [ -n "$remaining" ]; then
              echo "::warning::Real code conflict detected between upstream master and master-dev in: $remaining. Aborting merge."
              git merge --abort
              exit 0
            fi
          fi

          # Safety cleanup: ensure master-dev strictly keeps only its own workflows
          for f in .github/workflows/*; do
            is_allowed=false
            for allowed in "${allowed_workflows[@]}"; do
              if [ "$f" == "$allowed" ]; then
                is_allowed=true
                break
              fi
            done
            if [ "$is_allowed" = false ]; then
              echo "Pruning unwanted workflow: $f"
              git rm -rf "$f" 2>/dev/null || rm -rf "$f"
            fi
          done

          # Safety cleanup: ensure master-dev strictly keeps only mod issue templates
          for f in .github/ISSUE_TEMPLATE/*; do
            if [ "$f" != ".github/ISSUE_TEMPLATE/mod-bug-report.yml" ] && [ "$f" != ".github/ISSUE_TEMPLATE/mod-suggestion.yml" ] && [ "$f" != ".github/ISSUE_TEMPLATE/config.yml" ]; then
              echo "Pruning unwanted upstream issue template: $f"
              git rm -rf "$f" 2>/dev/null || rm -rf "$f"
            fi
          done

          git commit -m "chore: sync master-dev with upstream master (AI-assisted)" || true
          git push origin master-dev
          echo "master-dev successfully updated with latest upstream changes (unwanted workflows ignored)."
