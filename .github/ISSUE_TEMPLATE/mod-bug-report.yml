name: "\U0001F9E9 Mod Bug Report"
description: Report a bug found in one of this repository's custom mods (not a vanilla/base-game bug).
labels: ["bug", "mod-bug", "needs-triage"]
type: "bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing one of our custom mods! This form is **only** for bugs in a
        custom mod branch (`jak[1-3]/features/*`, `jak[1-3]/config/*`, ...).
        For a bug in the vanilla/base game, please use the "Jak 1/2/3 Bug Report" template instead.

        The fields below let us route your report to the right mod branch, reproduce it with
        the exact same version you played, and link the eventual fix commit directly back to
        this issue (so it auto-closes and shows up in the next release's changelog).

  - type: checkboxes
    attributes:
      label: Acknowledgements
      description: Take a couple minutes to help our maintainers work faster.
      options:
        - label: I have [searched](https://github.com/open-goal/jak-project/issues?q=is%3Aissue+label%3Amod-bug+sort%3Aupdated-desc+) for duplicate or closed mod bug reports
          required: true
        - label: I understand that I am supposed to provide my own legitimately obtained copy of the game
          required: true

  - type: dropdown
    attributes:
      label: Game
      description: Which game is the mod running on?
      options:
        - Jak 1
        - Jak 2
        - Jak 3
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Mod Concerned
      description: >
        Only mods with at least one published GitHub Release are listed, by the exact
        display name from that release (kept in sync automatically — see
        docs/modding/tools/mod_bug_tracking.md). If your mod isn't listed — it may still
        be unreleased, or in beta — pick "Other" and name it precisely in the field below.
      options:
        # BEGIN GENERATED — scripts/modding/sync_bug_report_options.py (do not edit by hand)
        - "[Jak 2] Haven City : Rebellion"
        - "[Jak 2] Peaceful Haven City (Freedom Fighters)"
        # END GENERATED
        - "Other / not listed above (specify in the field below)"
    validations:
      required: true

  - type: input
    attributes:
      label: Exact Mod Name (if you selected "Other" above)
      description: The mod's display name as shown in the Launcher's Mods tab, or its project/branch name if it's an unreleased/dev build.
      placeholder: My Mod's Display Name
    validations:
      required: false

  - type: input
    attributes:
      label: Mod Version
      description: >
        The version tag you installed (e.g. `v1.0.0`, visible in the Launcher's mod page or in
        this repo's Releases). If you built it yourself from source, give the commit hash
        (`git rev-parse HEAD`) instead.
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    attributes:
      label: How did you install this mod?
      options:
        - "OpenGOAL Launcher (mod catalog / 1-click install)"
        - "Debug build (compiled from source myself)"
        - "Other (manual zip install, specify below)"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior, as precisely as possible (location, task/mission state, what you pressed).
      placeholder: |
        1. Go to '...'
        2. Trigger '...'
        3. See error
    validations:
      required: true

  - type: textarea
    attributes:
      label: Attachments (screenshots, GIF or video)
      description: >
        Drag and drop image, GIF or video files directly into this box (GitHub hosts them for
        you) — this is the fastest way for us to confirm a visual/gameplay bug. If the video is
        too large to attach here, paste a link to it instead.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Environment Information
      description: "CPU, GPU, OS Version, and the OpenGOAL Version shown in the window's title bar. You can also attach the Launcher's Support Package here."
    validations:
      required: false
