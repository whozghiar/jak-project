name: 🔄 Sync Upstream Mirror & Mod Branches

on:
  schedule:
    # Exécution quotidienne à 12:00 (Heure de Paris UTC+2 = 10:00 UTC en heure d'été)
    # Remplacez par '0 12 * * *' si vous préférez 12:00 UTC (14:00 Paris)
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync-upstream:
    name: Sync Master with Upstream & Propagate to Master-Dev
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Author & Settings
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global checkout.defaultRemote origin

      - name: Sync master with upstream/master (Fast-Forward)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "Fetching upstream official repository..."
          git remote add upstream https://github.com/open-goal/jak-project.git || true
          git fetch upstream master

          echo "Fast-forwarding master branch..."
          git checkout -B master origin/master
          if git merge --ff-only upstream/master; then
            echo "Pushing updated master to origin..."
            if [ -n "$GH_PAT" ]; then
              git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}
            fi
            if ! git push origin master; then
              echo "::warning::Could not push master to origin (likely due to upstream workflow updates that GITHUB_TOKEN is restricted from pushing). To automate this, create a PAT with repo+workflow scope and set it as secret GH_PAT."
            fi
            git remote set-url origin https://github.com/${{ github.repository }}
          fi

      - name: Sync master-dev with master
        id: sync_master_dev
        run: |
          echo "Checking out master-dev..."
          git checkout master-dev

          echo "Attempting to merge master into master-dev..."
          # Attempt merge; handle modify/delete conflicts on removed workflows gracefully
          if ! git merge master --no-commit; then
            echo "Checking merge conflicts..."
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "Conflicts detected in: $conflicts"

            # Discard any upstream workflow changes for deleted workflows and pruned issue templates
            allowed_workflows=(".github/workflows/sync-upstream.yaml" ".github/workflows/release.yml" ".github/workflows/branch-sync-check.yaml" ".github/workflows/sync-global-catalog.yml" ".github/workflows/mod-bug-report-sync.yml" ".github/workflows/mod-bug-triage.yml")
            for file in $conflicts; do
              if [[ "$file" == .github/workflows/* ]]; then
                is_allowed=false
                for allowed in "${allowed_workflows[@]}"; do
                  if [ "$file" == "$allowed" ]; then
                    is_allowed=true
                    break
                  fi
                done
                if [ "$is_allowed" = false ]; then
                  echo "Ignoring upstream changes and removing unwanted workflow: $file"
                  git rm -f "$file"
                fi
              elif [[ "$file" == .github/ISSUE_TEMPLATE/* ]]; then
                if [ "$file" == ".github/ISSUE_TEMPLATE/config.yml" ]; then
                  echo "Preserving custom mod issue configuration in $file"
                  git checkout --ours "$file"
                  git add "$file"
                elif [ "$file" != ".github/ISSUE_TEMPLATE/mod-bug-report.yml" ]; then
                  echo "Pruning upstream issue template: $file"
                  git rm -f "$file"
                fi
              fi
            done

            # Verify if any non-workflow / non-template conflicts remain
            remaining=$(git diff --name-only --diff-filter=U)
            if [ -n "$remaining" ]; then
              echo "::warning::Real code conflict detected between upstream master and master-dev in: $remaining. Aborting merge."
              git merge --abort
              exit 0
            fi
          fi

          # Safety cleanup: ensure master-dev strictly keeps only its own workflows
          for f in .github/workflows/*; do
            is_allowed=false
            for allowed in "${allowed_workflows[@]}"; do
              if [ "$f" == "$allowed" ]; then
                is_allowed=true
                break
              fi
            done
            if [ "$is_allowed" = false ]; then
              echo "Pruning unwanted workflow: $f"
              git rm -rf "$f" 2>/dev/null || rm -rf "$f"
            fi
          done

          # Safety cleanup: ensure master-dev strictly keeps only Mod Bug Report template
          for f in .github/ISSUE_TEMPLATE/*; do
            if [ "$f" != ".github/ISSUE_TEMPLATE/mod-bug-report.yml" ] && [ "$f" != ".github/ISSUE_TEMPLATE/config.yml" ]; then
              echo "Pruning unwanted upstream issue template: $f"
              git rm -rf "$f" 2>/dev/null || rm -rf "$f"
            fi
          done

          git commit -m "chore: sync master-dev with upstream master (AI-assisted)" || true
          git push origin master-dev
          echo "master-dev successfully updated with latest upstream changes (unwanted workflows ignored)."

      - name: Sync Mod Branches & Update Conflict Dashboard
        run: |
          echo "Synchronizing clean mod branches with master, logging history, and updating dashboard..."
          # --push both merges/pushes every clean mod branch AND commits+pushes the
          # updated dashboard/history files to master-dev itself when they changed
          # (see sync_branches_with_master.py's commit_and_push_dashboard()) — this
          # step no longer duplicates that commit logic here.
          python scripts/modding/sync_branches_with_master.py --push
