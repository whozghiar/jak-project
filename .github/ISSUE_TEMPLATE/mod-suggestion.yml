name: "💡 Mod Suggestion / Suggestion de Mod"
description: Propose a new mod concept, gameplay mechanic, custom asset, or feature / Proposer une idée de mod pour OpenGOAL.
labels: ["enhancement", "mod-suggestion", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### 💡 OpenGOAL Mod Suggestion / Proposition d'Idée de Mod
        Have a creative idea for a new mod or feature for **Jak 1, Jak 2, or Jak 3**?
        Share your concept below! Community modders and maintainers can review, discuss, and implement ideas.
        
        *Note: All mods in this repository follow our non-regression rule and in-game toggle policy (L3 + SELECT in retail boot).*

  - type: dropdown
    id: game
    attributes:
      label: Target Game / Jeu Ciblé
      description: Which game is this mod idea intended for?
      options:
        - Jak 1
        - Jak 2
        - Jak 3
        - Jak X
        - Multi-Game / Trilogy
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Mod Category / Catégorie de Mod
      description: What type of mod is this?
      options:
        - "Gameplay & Mechanics (moves, abilities, combat, vehicles)"
        - "Custom 3D Entities & Actors (models, enemies, NPCs, bosses)"
        - "Textures & Visuals (HD texture packs, HUD, shaders, reskins)"
        - "Audio & Music (custom sound banks, music, voice lines)"
        - "Level Design & Environment (custom levels, world edits)"
        - "Quality of Life & Config (spawns, cheats, camera, controls)"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Mod Title / Nom Proposé du Mod
      description: A short, catchy working title for this mod idea.
      placeholder: "e.g. Jak 3 JetBoard in Jak 1 / Blue Krimzon Guard / Hoverboard Grinding"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Concept & Gameplay Description / Description Détaillée
      description: Describe what the mod would do, how it would work in-game, and why players would enjoy it.
      placeholder: "Explain the gameplay changes, new abilities, mechanics, or art in detail..."
    validations:
      required: true

  - type: textarea
    id: toggle_settings
    attributes:
      label: In-Game Toggle & Options / Activation & Menu en Jeu
      description: How should this feature be toggled or configured in the in-game Mods menu (L3 + SELECT)?
      placeholder: "e.g. OFF by default, toggleable in Mods menu with an option for speed multiplier..."
    validations:
      required: false

  - type: textarea
    id: inspirations
    attributes:
      label: Inspirations & References / Références & Liens
      description: Links to videos, screenshots, other games, or code concepts that illustrate your idea.
    validations:
      required: false
