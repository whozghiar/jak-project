name: 🏭 Release OpenGOAL Tooling

# Publishes this fork's tooling (gk, goalc, extractor, lsp and data/) as a
# GitHub release tagged vX.Y.Z, with the same asset names and archive layout
# as open-goal/jak-project's release pipeline:
#   opengoal-windows-vX.Y.Z.zip, opengoal-linux-vX.Y.Z.tar.gz,
#   opengoal-lsp-windows-vX.Y.Z.exe, opengoal-lsp-linux-vX.Y.Z.bin
# so the OpenGOAL Launcher and other tools can point at this repository
# instead of upstream. macOS is not built.
#
# Manual only (workflow_dispatch), from master-dev usually. Mother repository
# only: a mod repository publishes mods with release.yml instead. Restricted
# to the repository owner (see the `authorize` job).
#
# Nothing is published unless both builds succeed: the tag is created on
# GitHub by the final `publish` job. Each build job tags its own checkout
# first, because common/CMakeLists.txt bakes `git tag --points-at HEAD` into
# the binaries as their version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tooling version without the leading v (e.g. 0.3.9), released as tag vX.Y.Z'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

concurrency:
  group: release-tooling
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # =========================================================================
  # OWNER-ONLY GATE + TAG CHECK
  # =========================================================================
  authorize:
    name: "🔒 Verify Actor & Version"
    if: endsWith(github.repository, '/jak-project')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Restrict to repository owner
        if: github.actor != github.repository_owner
        run: |
          echo "::error::This workflow may only be run by the repository owner (${{ github.repository_owner }}). Triggered by: ${{ github.actor }}."
          exit 1

      - name: Validate version and check the tag is free
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not X.Y.Z (optionally X.Y.Z-suffix), without a leading v."
            exit 1
          fi
          TAG="v$VERSION"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists in ${{ github.repository }}. Pick a new version."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # 1. BUILD WINDOWS
  # =========================================================================
  build-windows:
    name: "🖥️ Windows (Clang-CL Static)"
    needs: authorize
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - name: Install NASM
        run: choco install nasm

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          variant: sccache
          key: windows-tooling-static-${{ github.sha }}
          restore-keys: |
            windows-tooling-static-
            windows-release-static-

      - name: Setup MSVC Command Prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Remove Strawberry Perl from PATH
        run: |
          $env:PATH = $env:PATH -replace "C:\\Strawberry\\c\\bin;", ""
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Tag the checkout (version baked into the binaries)
        shell: bash
        run: git tag "${{ needs.authorize.outputs.tag }}"

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build --preset=Release-windows-clang-static ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Binaries (gk, goalc, extractor, lsp)
        shell: cmd
        run: cmake --build build --config Release --target gk --target goalc --target extractor --target lsp --parallel %NUMBER_OF_PROCESSORS%

      - name: Package Windows Release
        shell: bash
        run: |
          TAG="${{ needs.authorize.outputs.tag }}"
          ./.github/scripts/releases/extract_build_windows.sh dist build/bin .
          mkdir -p final
          7z a -tzip "final/opengoal-windows-${TAG}.zip" ./dist/*
          cp build/bin/lsp.exe "final/opengoal-lsp-windows-${TAG}.exe"

      - name: Upload Windows Assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tooling-windows
          path: final/*
          if-no-files-found: error

  # =========================================================================
  # 2. BUILD LINUX
  # =========================================================================
  build-linux:
    name: "🐧 Linux (Clang Static)"
    needs: authorize
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang gcc g++ nasm \
            libxrandr-dev libxinerama-dev libxcursor-dev libpulse-dev \
            libxi-dev libgl1-mesa-dev libssl-dev ninja-build zip

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          variant: sccache
          key: linux-tooling-static-${{ github.sha }}
          restore-keys: |
            linux-tooling-static-
            linux-release-static-

      - name: Tag the checkout (version baked into the binaries)
        run: git tag "${{ needs.authorize.outputs.tag }}"

      - name: Configure CMake
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build --preset=Release-linux-clang-static \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Binaries (gk, goalc, extractor, lsp)
        run: cmake --build build --config Release --target gk --target goalc --target extractor --target lsp --parallel $(nproc)

      - name: Strip Binaries
        run: strip build/game/gk build/goalc/goalc build/decompiler/extractor build/lsp/lsp

      - name: Package Linux Release
        run: |
          TAG="${{ needs.authorize.outputs.tag }}"
          ./.github/scripts/releases/extract_build_unix.sh dist build .
          mkdir -p final
          tar czf "final/opengoal-linux-${TAG}.tar.gz" -C dist .
          cp build/lsp/lsp "final/opengoal-lsp-linux-${TAG}.bin"
          chmod +x "final/opengoal-lsp-linux-${TAG}.bin"

      - name: Upload Linux Assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tooling-linux
          path: final/*
          if-no-files-found: error

  # =========================================================================
  # 3. PUBLISH (tag + release, only once both builds succeeded)
  # =========================================================================
  publish:
    name: "📦 Publish Release"
    needs: [authorize, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download Build Assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: final
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.authorize.outputs.tag }}
          PRERELEASE_INPUT: ${{ github.event.inputs.prerelease }}
        run: |
          ls -l final
          PRERELEASE_FLAG=""
          if [ "$PRERELEASE_INPUT" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" final/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE_FLAG
